<div class="min-h-screen bg-background text-on-surface">
  <header class="sticky top-0 z-50 border-b border-outline-variant/20 bg-surface/95 backdrop-blur">
    <div class="mx-auto flex max-w-[1200px] flex-wrap items-center justify-between gap-3 px-gutter py-4">
      <a routerLink="/" class="flex items-center gap-3 text-lg font-bold text-primary hover:text-primary-dark">
        <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-primary text-base font-bold text-white">L</div>
        <span>LexiLearn</span>
      </a>

      <div class="flex flex-wrap items-center gap-3">
        <nav class="flex flex-wrap items-center gap-2 text-sm font-semibold">
          <a routerLink="/" routerLinkActive="text-primary" [routerLinkActiveOptions]="{ exact: true }" class="rounded-full px-4 py-2 transition hover:bg-surface-container-low">Dashboard</a>
          <a routerLink="/list" routerLinkActive="text-primary" class="rounded-full px-4 py-2 transition hover:bg-surface-container-low">Word List</a>
          <a routerLink="/flashcards" routerLinkActive="text-primary" class="rounded-full px-4 py-2 transition hover:bg-surface-container-low">Flashcards</a>
        </nav>

        <ng-container *ngIf="user$ | async as user; else signedOut">
          <span class="hidden max-w-[220px] truncate rounded-full bg-surface-container-low px-4 py-2 text-sm font-semibold text-on-surface-variant md:inline">
            {{ user.email }}
          </span>
          <button class="rounded-full border border-outline-variant/30 bg-surface px-4 py-2 text-sm font-semibold text-primary transition hover:bg-surface-container" type="button" (click)="signOut()">
            Logout
          </button>
        </ng-container>

        <ng-template #signedOut>
          <a routerLink="/auth" routerLinkActive="text-primary" class="rounded-full bg-primary px-4 py-2 text-sm font-semibold text-white transition hover:bg-primary-dark">Sign In</a>
        </ng-template>
      </div>
    </div>
  </header>

  <main class="pb-10">
    <router-outlet></router-outlet>
  </main>
</div>
