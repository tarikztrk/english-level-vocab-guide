<div class="min-h-screen bg-background text-on-surface">
  <section class="mx-auto max-w-[1200px] px-gutter py-10">
    <div class="rounded-[2rem] border border-outline-variant/20 bg-white p-8 shadow-sm">
      <div class="mb-8 flex flex-col gap-6 lg:flex-row lg:items-center lg:justify-between">
        <div>
          <p class="text-sm font-semibold uppercase tracking-[0.24em] text-primary/90">Word Explorer</p>
          <h1 class="mt-3 text-4xl font-bold text-on-surface">{{ title }}</h1>
          <p class="mt-3 max-w-2xl text-sm text-on-surface-variant">Browse curated vocabulary, filter by category, and mark words as learned for quick review.</p>
        </div>
        <div class="flex flex-wrap gap-3">
          <button routerLink="/flashcards" class="inline-flex items-center gap-2 rounded-2xl bg-primary px-4 py-3 text-sm font-semibold text-white transition hover:bg-primary-dark">
            <span class="material-symbols-outlined">view_carousel</span>
            Study Flashcards
          </button>
          <button class="inline-flex items-center gap-2 rounded-2xl border border-outline-variant/30 bg-surface px-4 py-3 text-sm font-semibold text-primary transition hover:bg-surface-container">
            <span class="material-symbols-outlined">download</span>
            Export List
          </button>
        </div>
      </div>

      <div class="grid gap-6 lg:grid-cols-[1fr_280px]">
        <div class="space-y-6">
          <div class="rounded-3xl border border-outline-variant/20 bg-surface p-5 shadow-sm">
            <div class="grid gap-4 md:grid-cols-[1fr_auto] md:items-center">
              <div class="relative">
                <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline-variant">search</span>
                <input class="w-full rounded-2xl border border-outline-variant/50 bg-white px-10 py-3 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/10" [(ngModel)]="search" placeholder="Search vocabulary..." type="text" />
              </div>
              <div class="flex flex-wrap gap-3 justify-end">
                <button *ngFor="let option of sortOptions" (click)="setSort(option)" [ngClass]="{ 'bg-primary text-white': selectedSort === option, 'bg-white text-primary border border-outline-variant/50 hover:bg-surface-container': selectedSort !== option }" class="rounded-2xl px-4 py-3 text-sm font-semibold transition">
                  {{ option }}
                </button>
              </div>
            </div>
          </div>

          <div class="grid gap-4">
            <div *ngFor="let item of filteredWords" class="rounded-[2rem] border border-outline-variant/20 bg-white p-6 shadow-sm transition hover:-translate-y-0.5 hover:shadow-md">
              <div class="flex flex-col gap-4 lg:flex-row lg:items-center lg:justify-between">
                <div class="space-y-3">
                  <div class="flex flex-wrap items-center gap-3">
                    <h2 class="text-xl font-bold">{{ item.word }}</h2>
                    <span class="rounded-full bg-surface-container-low px-3 py-1 text-xs font-semibold text-on-surface-variant">{{ item.category }}</span>
                  </div>
                  <p class="text-sm text-on-surface-variant">{{ item.phonetic }}</p>
                  <p class="text-sm leading-6">{{ item.meaning }}</p>
                </div>
                <div class="flex flex-col gap-3 sm:items-end">
                  <div class="flex flex-wrap items-center gap-2">
                    <button (click)="toggleLearned(item)" class="rounded-full border px-4 py-2 text-sm font-semibold transition" [ngClass]="item.learned ? 'border-secondary bg-secondary/10 text-secondary' : 'border-outline-variant/30 text-primary hover:bg-primary/10'">
                      {{ item.learned ? 'Learned' : 'Mark Learned' }}
                    </button>
                    <button (click)="toggleBookmark(item)" class="inline-flex items-center gap-2 rounded-full border px-4 py-2 text-sm font-semibold transition" [ngClass]="item.bookmarked ? 'border-secondary bg-secondary/10 text-secondary' : 'border-outline-variant/30 text-primary hover:bg-primary/10'">
                      <span class="material-symbols-outlined">bookmark</span>
                      {{ item.bookmarked ? 'Bookmarked' : 'Bookmark' }}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <aside class="rounded-3xl border border-outline-variant/20 bg-white p-5 shadow-sm">
          <h3 class="mb-4 text-lg font-bold">Study Dashboard</h3>
          <div class="space-y-4">
            <div class="rounded-2xl bg-surface-container-low p-4">
              <p class="text-sm text-on-surface-variant">Mastery</p>
              <p class="mt-2 text-2xl font-bold text-primary">65%</p>
            </div>
            <div class="rounded-2xl bg-surface-container-low p-4">
              <p class="text-sm text-on-surface-variant">New Words</p>
              <p class="mt-2 text-2xl font-bold text-secondary">24</p>
            </div>
            <div class="rounded-2xl bg-surface-container-low p-4">
              <p class="text-sm text-on-surface-variant">Words Remaining</p>
              <p class="mt-2 text-2xl font-bold text-tertiary">7</p>
            </div>
          </div>
          <div class="mt-6 space-y-3">
            <button routerLink="/flashcards" class="w-full rounded-2xl bg-primary px-4 py-3 text-sm font-bold text-white transition hover:bg-primary-dark">Open Flashcards</button>
            <button class="w-full rounded-2xl border border-outline-variant/20 bg-surface px-4 py-3 text-sm font-semibold text-on-surface transition hover:bg-surface-container">Review difficult words</button>
          </div>
        </aside>
      </div>
    </div>
  </section>
</div>
