<div class="min-h-screen bg-background text-on-surface">
  <section class="mx-auto flex max-w-[720px] px-gutter py-12">
    <div class="w-full rounded-[2rem] border border-outline-variant/20 bg-white p-8 shadow-sm">
      <p class="text-sm font-semibold uppercase tracking-[0.24em] text-primary/90">Account</p>
      <h1 class="mt-3 text-3xl font-bold text-on-surface">{{ title }}</h1>
      <p class="mt-3 text-sm text-on-surface-variant">Sign in to save learned words and bookmarks to your own Supabase profile.</p>

      <form class="mt-8 space-y-5" (ngSubmit)="submit()">
        <label class="block">
          <span class="text-sm font-semibold text-on-surface">Email</span>
          <input class="mt-2 w-full rounded-2xl border border-outline-variant/50 bg-surface px-4 py-3 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/10" [(ngModel)]="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-on-surface">Password</span>
          <input class="mt-2 w-full rounded-2xl border border-outline-variant/50 bg-surface px-4 py-3 text-sm focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/10" [(ngModel)]="password" name="password" type="password" autocomplete="current-password" placeholder="Minimum 6 characters" />
        </label>

        <p *ngIf="errorMessage" class="rounded-2xl border border-red-200 bg-red-50 px-4 py-3 text-sm font-semibold text-red-700">{{ errorMessage }}</p>
        <p *ngIf="successMessage" class="rounded-2xl border border-secondary/20 bg-secondary/10 px-4 py-3 text-sm font-semibold text-secondary">{{ successMessage }}</p>

        <button class="w-full rounded-2xl bg-primary px-5 py-3 text-sm font-bold text-white transition hover:bg-primary-dark disabled:cursor-not-allowed disabled:opacity-60" type="submit" [disabled]="loading">
          {{ loading ? 'Please wait...' : submitLabel }}
        </button>
      </form>

      <button class="mt-5 w-full rounded-2xl border border-outline-variant/30 bg-surface px-5 py-3 text-sm font-bold text-primary transition hover:bg-surface-container" type="button" (click)="toggleMode()">
        {{ toggleLabel }}
      </button>
    </div>
  </section>
</div>
