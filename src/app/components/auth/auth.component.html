<div class="min-h-screen bg-background text-on-surface">
  <section class="mx-auto flex min-h-[70vh] max-w-[720px] items-center px-gutter py-12">
    <div class="w-full rounded-[2rem] border border-outline-variant/20 bg-surface p-8 shadow-sm">
      <p class="text-sm font-semibold uppercase tracking-[0.24em] text-primary/90">Hesap</p>
      <h1 class="mt-3 text-3xl font-bold text-on-surface">{{ title }}</h1>
      <p class="mt-3 text-sm text-on-surface-variant">Öğrendiğiniz kelimeleri ve kaydettiklerinizi hesabınıza kaydetmek için giriş yapın.</p>

      <form class="mt-8 space-y-5" (ngSubmit)="submit()">
        <label class="block">
          <span class="text-sm font-semibold text-on-surface">E-posta</span>
          <input class="mt-2 w-full rounded-2xl border border-outline-variant/50 bg-surface-container-lowest px-4 py-3 text-sm focus:border-primary focus:ring-2 focus:ring-primary/10" [(ngModel)]="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" />
        </label>

        <label class="block">
          <span class="text-sm font-semibold text-on-surface">Şifre</span>
          <input class="mt-2 w-full rounded-2xl border border-outline-variant/50 bg-surface-container-lowest px-4 py-3 text-sm focus:border-primary focus:ring-2 focus:ring-primary/10" [(ngModel)]="password" name="password" type="password" [attr.autocomplete]="mode === 'signIn' ? 'current-password' : 'new-password'" placeholder="En az 6 karakter" />
        </label>

        <p *ngIf="errorMessage" role="alert" class="rounded-2xl border border-error/30 bg-error-container px-4 py-3 text-sm font-semibold text-on-error-container">{{ errorMessage }}</p>
        <p *ngIf="successMessage" role="status" class="rounded-2xl border border-secondary/20 bg-secondary/10 px-4 py-3 text-sm font-semibold text-secondary">{{ successMessage }}</p>

        <button class="w-full rounded-2xl bg-primary px-5 py-3 text-sm font-bold text-white transition hover:bg-primary-dark disabled:cursor-not-allowed disabled:opacity-60" type="submit" [disabled]="loading">
          {{ loading ? 'Lütfen bekleyin...' : submitLabel }}
        </button>
      </form>

      <button class="mt-5 w-full rounded-2xl border border-outline-variant/30 bg-surface px-5 py-3 text-sm font-bold text-primary transition hover:bg-surface-container" type="button" (click)="toggleMode()">
        {{ toggleLabel }}
      </button>
    </div>
  </section>
</div>
